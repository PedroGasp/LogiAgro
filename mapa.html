<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização do GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100vh; }
        .voltar-btn {
            position: absolute; top: 20px; left: 50px; z-index: 1000;
            background: white; padding: 10px 15px; border-radius: 5px;
            text-decoration: none; color: #333; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif;
        }
    </style>
</head>
<body>

    <a href="#" onclick="history.back(); return false;" class="voltar-btn">← Sair</a>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-22.2570, -45.7035], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const estiloPontoAzul = {
            radius: 8,
            fillColor: "#007bff",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
        };

        fetch('http://162.243.170.189:3000/api/pontos')
            .then(response => response.json())
            .then(pontos => {
                pontos.forEach(ponto => {
                    const lat = parseFloat(ponto.latitude);
                    const lng = parseFloat(ponto.longitude);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        // Cria o ponto azul na coordenada
                        L.circleMarker([lat, lng], estiloPontoAzul)
                            .addTo(map)
                            .bindPopup(`<b>Dispositivo:</b> ${ponto.nome_ponto}<br><b>ID:</b> ${ponto.id}`);
                    }
                });
            })
            .catch(err => console.error("Erro ao carregar pontos no mapa:", err));
    </script>
</body>
</html>
