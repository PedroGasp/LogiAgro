<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações - LogiAgro</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Opções</h2>
            <span class="material-symbols-outlined close-btn" onclick="toggleMenu()">close</span>
        </div>
        <nav class="sidebar-links">
            <a href="index.html"><span class="material-symbols-outlined">home</span> Início</a>
            <a href="alertas.html" class="active"><span class="material-symbols-outlined">notifications</span> Notificações</a>
            <a href="alertas.html"><span class="material-symbols-outlined">warning</span> Alertas</a>
            <a href="rebanho.html"><span class="material-symbols-outlined">agriculture</span> Rebanho</a>
            <a href="mercado.html"><span class="material-symbols-outlined">store</span> Mercado</a>
            <a href="#"><span class="material-symbols-outlined">settings</span> Configurações</a>
            <a href="#"><span class="material-symbols-outlined">help</span> Ajuda</a>
            <a href="#"><span class="material-symbols-outlined">logout</span> Sair</a>
        </nav>
    </div>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <header class="main-header">
        <div class="icon-btn" onclick="toggleMenu()">
            <span class="material-symbols-outlined">menu</span>
        </div>

        <div class="logo-container">
            <h1 class="company-name">LogiAgro</h1>
            <img src="Logo/logo-touro2.png" alt="Logo Touro" class="app-logo">
        </div>

        <div class="icon-btn" onclick="abrirLogin()">
            <span class="material-symbols-outlined">person</span>
        </div>
    </header>

    <main class="container notificacoes-section">
        <div class="rebanho-header">
            <div>
                <h2>Notificações</h2>
                <p>Veja as últimas movimentações, ofertas e negociações do seu rebanho.</p>
            </div>
        </div>

        <div class="notificacoes-toolbar" aria-label="Filtros de notificações">
            <button type="button" class="notification-filter is-active" data-filter="all">Todas</button>
            <button type="button" class="notification-filter" data-filter="desconto">Descontos</button>
            <button type="button" class="notification-filter" data-filter="aceita">Aceitas</button>
            <button type="button" class="notification-filter" data-filter="negociacao">Negociações</button>
        </div>

        <div id="notificacoesList" class="notificacoes-list" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
