<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas - LogiAgro</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Opções</h2>
            <span class="material-symbols-outlined close-btn" onclick="toggleMenu()">close</span>
        </div>
        <nav class="sidebar-links">
            <a href="index.html"><span class="material-symbols-outlined">home</span> Início</a>
            <a href="notificacoes.html"><span class="material-symbols-outlined">notifications</span> Notificações</a>
            <a href="alertas.html" class="active"><span class="material-symbols-outlined">warning</span> Alertas</a>
            <a href="rebanho.html"><span class="material-symbols-outlined">agriculture</span> Rebanho</a>
            <a href="mercado.html"><span class="material-symbols-outlined">store</span> Mercado</a>
            <a href="#"><span class="material-symbols-outlined">settings</span> Configurações</a>
            <a href="#"><span class="material-symbols-outlined">help</span> Ajuda</a>
            <a href="#"><span class="material-symbols-outlined">logout</span> Sair</a>
        </nav>
    </div>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <header class="main-header">
        <div class="icon-btn" onclick="toggleMenu()">
            <span class="material-symbols-outlined">menu</span>
        </div>

        <div class="logo-container">
            <h1 class="company-name">LogiAgro</h1>
            <img src="Logo/logo-touro2.png" alt="Logo Touro" class="app-logo">
        </div>

        <div class="icon-btn" onclick="abrirLogin()">
            <span class="material-symbols-outlined">person</span>
        </div>
    </header>

    <main class="container notificacoes-section">
        <div class="rebanho-header">
            <div>
                <h2>Alertas</h2>
                <p>Monitore situações críticas e ações urgentes do seu rebanho.</p>
            </div>
        </div>

        <div class="notificacoes-toolbar" aria-label="Filtros de alertas">
            <button type="button" class="notification-filter is-active" data-filter="all">Todos</button>
            <button type="button" class="notification-filter" data-filter="area">Área</button>
            <button type="button" class="notification-filter" data-filter="saude">Saúde</button>
            <button type="button" class="notification-filter" data-filter="bateria">Bateria</button>
            <button type="button" class="notification-filter" data-filter="morte">Risco</button>
        </div>

        <div id="alertasList" class="notificacoes-list" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
