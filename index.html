<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Opções</h2>
            <span class="material-symbols-outlined close-btn" onclick="toggleMenu()">close</span>
        </div>
        <nav class="sidebar-links">
            <a href="login.html"><span class="material-symbols-outlined">home</span> Início</a>
            <a href="#"><span class="material-symbols-outlined">notifications</span> Notificações</a>
            <a href="#"><span class="material-symbols-outlined">warning</span> Alertas</a>
            <a href="rebanho.html"><span class="material-symbols-outlined">agriculture</span> Rebanho</a>
            <a href="mercado.html"><span class="material-symbols-outlined">store</span> Mercado</a>
            <a href="#"><span class="material-symbols-outlined">settings</span> Configurações</a>
            <a href="#"><span class="material-symbols-outlined">help</span> Ajuda</a>
            <a href="#"><span class="material-symbols-outlined">logout</span> Sair</a>
        </nav>
    </div>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <header class="main-header">
        
        <div class="icon-btn" onclick="toggleMenu()">
            <span class="material-symbols-outlined">menu</span>
        </div>

        <div class="logo-container">
            <h1 class="company-name">LogiAgro</h1>
            <img src="Logo/logo-touro2.png" alt="Logo Touro" class="app-logo">
        </div>

    <div class="icon-btn" onclick="abrirLogin()">
        <span class="material-symbols-outlined">person</span>
    </div>

    <div id="loginModal">
        <div class="login-box">
            <h2>Login</h2>
            <form onsubmit="login(event, this)">
                <input type="email" name="email" placeholder="Email">
                <input type="password" name="senha" placeholder="Senha">
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

    </header>

    <main class="container">
        <section class="top-section">
            
            <a href="mapa.html" target="_self" style="text-decoration: none; color: inherit; display: block; flex: 1;">
                <div class="card monitoramento" style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;">
                    <div class="circle-icon">
                        <span class="material-symbols-outlined pin">location_on</span>
                    </div>
                    <h2>Monitoramento</h2>
                </div>
            </a>
            <div class="side-cards">
                <a href="alertas.html" class="card mini-card notification-link" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <span class="material-symbols-outlined red-icon">report</span>
                    <p>Alertas</p>
                </a>
                <a href="alertas.html" class="card mini-card notification-link" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <span class="material-symbols-outlined blue-icon">notifications</span>
                    <p>Notificações</p>
                </a>
            </div>
        </section>
        
         <a href="mercado.html" target="_self" style="text-decoration: none; color: inherit; display: block; flex: 1;">
            <section class="mercado-section card">
                <h3>Mercado</h3>
                <div id="lista-mercado"></div>
            </section>
        </a>
</main>

    <script src="script.js"></script>
</body>
</html>
