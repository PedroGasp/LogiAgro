<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard App</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <span class="material-symbols-outlined icon-white">menu</span>
    
        <div class="Logo-container">
            <h1 class="company-name">LogiAgro</h1>
            <img src="Logo/logo-touro2.png" alt="Logo Touro" class="app-logo">
        </div>
    
        <span class="material-symbols-outlined icon-white">person</span>
    </header>

    <main class="container">
        <section class="top-section">
            <div class="card monitoramento">
                <div class="circle-icon">
                    <span class="material-symbols-outlined pin">location_on</span>
                </div>
                <h2>Monitoramento</h2>
            </div>
            
            <div class="side-cards">
                <div class="card mini-card">
                    <span class="material-symbols-outlined red-icon">report</span>
                    <p>Alertas</p>
                </div>
                <div class="card mini-card">
                    <span class="material-symbols-outlined blue-icon">notifications</span>
                    <p>Notificações</p>
                </div>
            </div>
        </section>

        <section class="mercado-section card">
            <h3>Mercado</h3>
            <div id="lista-mercado">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
